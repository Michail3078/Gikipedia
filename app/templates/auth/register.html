{% extends "base.html" %}
{% block title %}Регистрация — Gikipedia{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h1>Регистрация</h1>
        {% if error %}<p class="flash flash-error">{{ error }}</p>{% endif %}
        <form method="post" class="auth-form">
            <label for="username">Имя пользователя</label>
            <input id="username" type="text" name="username" required autofocus>

            <label for="password">Пароль</label>
            <input id="password" type="password" name="password" required minlength="6">

            <label for="confirm">Повторите пароль</label>
            <input id="confirm" type="password" name="confirm" required>

            <button type="submit" class="btn btn-primary btn-full">Создать аккаунт</button>
        </form>
        <p class="auth-switch">Уже есть аккаунт? <a href="{{ url_for('auth.login') }}">Войти</a></p>
    </div>
</div>
{% endblock %}
